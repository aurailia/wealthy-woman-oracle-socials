<html lang="en">
<head>

<title>Pull A Card | The Wealthy Woman Oracle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#2E2340;
  --plum-soft:#57496B;
  --purple:#5B2A86;
  --violet:#7B3FA0;
  --gold-deep:#8A6A0C;
  --pink:#E84F8A;
  --pink-deep:#B32A68;
  --grad:linear-gradient(120deg,#6A3494 0%,#9147AE 30%,#C55BA6 66%,#E86FA0 100%);
  --grad-title:linear-gradient(112deg,#5B2A86 0%,#8A45A6 32%,#C0509D 66%,#E2609B 100%);
  --grad-btn:linear-gradient(118deg,#D6438D 0%,#BE5DBE 52%,#9A76D2 100%);
  --rail:262px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--plum);background:#241A33;-webkit-font-smoothing:antialiased;}

.bg-layer{position:fixed;inset:0;background-image:var(--bg-url);background-size:cover;background-position:center;z-index:0;}
.bg-wash{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(30,20,44,.58) 0%,rgba(30,20,44,.46) 45%,rgba(30,20,44,.62) 100%);}

.shell{position:relative;z-index:2;display:flex;min-height:100vh;max-width:1240px;margin:0 auto;
  background:#EDE2F7;box-shadow:0 0 110px rgba(20,12,30,.55);}

/* rail */
.rail{width:var(--rail);flex:0 0 var(--rail);
  background:linear-gradient(168deg,#2A1F3C 0%,#3D2557 52%,#4E2C68 100%);
  border-right:1px solid rgba(255,255,255,.09);
  padding:34px 0 44px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.rail-mark{padding:0 26px 28px;}
.rail-glyph{font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#E2B6E8;opacity:.9;margin-bottom:10px;}
.rail-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;line-height:1.12;
  background:linear-gradient(112deg,#FBEFFF 0%,#F0B9DA 48%,#CDA7EE 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.rail-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:rgba(255,255,255,.62);margin-top:8px;}
.rail-nav{display:flex;flex-direction:column;gap:2px;padding:0 14px;}
.tab{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;
  padding:13px 14px;border-radius:8px;font-family:'Inter',sans-serif;font-size:15px;font-weight:500;
  color:rgba(255,255,255,.7);transition:background .25s ease,color .25s ease;position:relative;}
.tab:hover:not(.locked){background:rgba(255,255,255,.1);color:#fff;}
.tab:focus-visible{outline:2px solid #C9A6E8;outline-offset:2px;}
.tab.locked{opacity:.3;cursor:not-allowed;}
.tab.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600;}
.tab.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,#F0A9C8,#C9A6E8);}
.tab-num{font-family:'Cinzel',serif;font-size:12px;font-weight:600;width:20px;flex:0 0 20px;opacity:.8;}
.tab-label{flex:1;}
.rail-cards{padding:26px 22px 0;margin-top:26px;border-top:1px solid rgba(255,255,255,.13);}
.rail-cards-label{font-family:'Cinzel',serif;font-size:11.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#E2B6E8;margin-bottom:14px;}
.rail-card-img{border-radius:8px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.22);}
.rail-card-img img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;}
.rail-card-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;margin-top:9px;line-height:1.22;
  background:linear-gradient(112deg,#FBEFFF 0%,#F3BCDA 55%,#CFA9EE 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.rail-restart{margin-top:14px;}

/* stage */
.stage{flex:1;min-width:0;padding:56px 44px 90px;background:linear-gradient(180deg,#F2E9FA 0%,#EADDF6 58%,#F0E2F2 100%);}
.view{display:none;max-width:820px;margin:0 auto;}
.view.active{display:block;animation:riseIn .5s ease both;}
@keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

.eyebrow{font-family:'Cinzel',serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--purple);font-weight:600;margin-bottom:18px;}
.display{font-family:'Cormorant Garamond',serif;font-size:clamp(34px,5vw,52px);font-weight:600;line-height:1.12;
  background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.display em{font-style:italic;font-weight:500;}
.lede{font-family:'Cormorant Garamond',serif;font-size:21.5px;line-height:1.6;color:var(--plum-soft);margin-top:18px;max-width:640px;}
.rule{height:2px;border:0;margin:34px 0;border-radius:2px;opacity:.5;
  background:linear-gradient(90deg,#7B3FA0 0%,#E84F8A 46%,rgba(232,79,138,0) 100%);}

/* three-card pick */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:660px;margin:46px auto 0;}
.pick-card{border:0;padding:0;background:transparent;cursor:pointer;position:relative;
  border-radius:14px;overflow:visible;animation:dealIn .55s ease both;
  transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s ease;}
.pick-card:nth-child(2){animation-delay:.1s;}
.pick-card:nth-child(3){animation-delay:.2s;}
.pick-card img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;border-radius:14px;
  box-shadow:0 14px 34px rgba(46,25,70,.3);transition:box-shadow .4s ease;}
.pick-card:hover{transform:translateY(-12px);}
.pick-card:hover img{box-shadow:0 26px 46px rgba(46,25,70,.42);}
.pick-card:focus-visible{outline:2px solid var(--purple);outline-offset:5px;border-radius:14px;}
.pick-card.chosen{animation:popSelect .55s cubic-bezier(.34,1.4,.64,1) forwards;z-index:5;}
.pick-card.chosen img{box-shadow:0 26px 50px rgba(46,25,70,.48),0 0 0 3px #C9A227;}
.pick-card.faded{opacity:.18;pointer-events:none;transform:scale(.94);}
@keyframes dealIn{from{opacity:0;transform:translateY(22px) rotate(-3deg);}to{opacity:1;transform:none;}}
@keyframes popSelect{0%{transform:translateY(0) scale(1);}55%{transform:translateY(-22px) scale(1.09);}100%{transform:translateY(-16px) scale(1.05);}}
.pick-note{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--plum-soft);margin-top:30px;}

/* reveal */
.card-hero{width:100%;max-width:320px;margin:0 auto 32px;border-radius:16px;overflow:hidden;
  box-shadow:0 22px 50px rgba(46,25,70,.3);border:1px solid rgba(255,255,255,.7);animation:riseIn .6s ease both;}
.card-hero img{width:100%;display:block;}
.card-title{font-family:'Cormorant Garamond',serif;font-size:clamp(34px,4.8vw,48px);font-weight:600;line-height:1.1;text-align:center;
  background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.card-tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;text-align:center;color:var(--plum-soft);margin-top:10px;margin-bottom:32px;}

/* panels */
.panel{background:#fff;border:1px solid rgba(91,42,134,.16);border-radius:14px;padding:34px 36px;margin-bottom:22px;box-shadow:0 14px 38px rgba(46,25,70,.13);}
.panel-label{font-family:'Cinzel',serif;font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--purple);font-weight:600;margin-bottom:20px;}
.body-text p{font-size:17px;line-height:1.82;color:var(--plum);margin-bottom:16px;}
.body-text p:last-child{margin-bottom:0;}
.panel.in-short{background:linear-gradient(135deg,#F6EFFD 0%,#FFF 62%,#FCEFF6 100%);border-color:rgba(91,42,134,.26);}
.panel.in-short .body-text p{font-size:18.5px;line-height:1.78;font-family:'Cormorant Garamond',serif;}
.panel.practice{background:linear-gradient(135deg,#F7F0FD 0%,#FFF 52%,#FCEBF3 100%);
  border-color:rgba(179,42,104,.28);border-left:4px solid var(--pink-deep);}
.practice-title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;margin-bottom:14px;
  background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}

/* tapping */
.panel.tapping{border-left:4px solid var(--violet);}
.tap-intro{font-size:16.5px;line-height:1.78;color:var(--plum-soft);margin-bottom:22px;}
.tap-setup{background:linear-gradient(135deg,#F6EFFD,#FCEFF6);border-radius:11px;padding:22px 24px;margin-bottom:24px;
  border-left:3px solid var(--pink-deep);}
.tap-setup-label{font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--pink-deep);margin-bottom:11px;}
.tap-setup-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;line-height:1.6;color:var(--purple);}
.tap-points{list-style:none;}
.tap-points li{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid rgba(91,42,134,.1);align-items:baseline;}
.tap-points li:last-child{border-bottom:0;}
.tap-pt{font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold-deep);flex:0 0 118px;}
.tap-say{font-family:'Cormorant Garamond',serif;font-size:19.5px;line-height:1.5;color:var(--plum);}
.tap-close{margin-top:22px;padding-top:20px;border-top:1px solid rgba(91,42,134,.14);
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;line-height:1.65;color:var(--plum-soft);}

/* promo */
.promo{border-radius:16px;padding:46px 42px;margin-bottom:22px;background:var(--grad);color:#fff;box-shadow:0 22px 50px rgba(91,42,134,.32);}
.promo .panel-label{color:#FFE0EE;}
.promo-title{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;line-height:1.14;margin-bottom:20px;}
.promo-title em{font-style:italic;color:#FFE0A8;}
.promo p{font-size:17.5px;line-height:1.8;margin-bottom:16px;color:rgba(255,255,255,.96);}
.use-list{list-style:none;margin:4px 0 4px;}
.use-list li{position:relative;padding-left:26px;margin-bottom:14px;font-size:16.5px;line-height:1.72;color:var(--plum);}
.use-list li:last-child{margin-bottom:0;}
.use-list li::before{content:'';position:absolute;left:2px;top:11px;width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink-deep),var(--violet));}
.promo .use-list li{color:rgba(255,255,255,.96);}
.promo .use-list li::before{background:#FFE0A8;}
.join-btn{display:inline-block;margin-top:14px;text-decoration:none;font-family:'Cinzel',serif;font-size:12.5px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;padding:17px 34px;border-radius:8px;background:#fff;color:var(--purple);
  box-shadow:0 10px 26px rgba(0,0,0,.22);transition:transform .25s ease;}
.join-btn:hover{transform:translateY(-2px);}
.sign-off{margin-top:34px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;line-height:1.65;color:var(--purple);}

/* buttons */
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px;}
.btn{font-family:'Cinzel',serif;font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  padding:15px 28px;border-radius:8px;border:1.5px solid var(--pink-deep);background:transparent;color:var(--pink-deep);
  cursor:pointer;transition:background .25s ease,transform .25s ease,color .25s ease;}
.btn:hover{background:rgba(214,67,141,.12);color:#9A2E5E;transform:translateY(-2px);}
.btn:focus-visible{outline:2px solid var(--violet);outline-offset:3px;}
.btn.primary{background:var(--grad-btn);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(179,60,140,.28);}
.btn.primary:hover{opacity:.93;color:#fff;}
.btn.tiny{padding:11px 14px;font-size:11px;letter-spacing:.14em;width:100%;
  border-color:rgba(255,255,255,.36);color:rgba(255,255,255,.86);}
.btn.tiny:hover{background:rgba(255,255,255,.14);color:#fff;}

@media (max-width:900px){
  .shell{flex-direction:column;max-width:none;box-shadow:none;background:#EDE2F7;}
  .rail{width:100%;flex:none;height:auto;position:sticky;top:0;padding:16px 0 10px;border-right:0;
    border-bottom:1px solid rgba(255,255,255,.1);background:linear-gradient(150deg,#2A1F3C 0%,#3D2557 100%);z-index:20;}
  .rail-mark{padding:0 20px 12px;}
  .rail-title{font-size:23px;}
  .rail-sub{display:none;}
  .rail-nav{flex-direction:row;overflow-x:auto;gap:6px;padding:0 14px 4px;-webkit-overflow-scrolling:touch;}
  .tab{white-space:nowrap;padding:10px 14px;font-size:14px;}
  .tab.active::before{left:12px;right:12px;top:auto;bottom:2px;width:auto;height:3px;}
  .rail-cards{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;padding:14px 16px 4px;margin-top:10px;}
  .rail-cards-label{display:none;}
  .rail-card{flex:0 0 70px;}
  .rail-restart{display:none;}
  .stage{padding:34px 20px 70px;background:linear-gradient(180deg,#F2E9FA 0%,#EADDF6 100%);}
  .panel{padding:26px 22px;}
  .promo{padding:32px 24px;}
  .promo-title{font-size:28px;}
  .pick{gap:11px;margin-top:34px;}
  .tap-points li{flex-direction:column;gap:5px;}
  .tap-pt{flex:none;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  html{scroll-behavior:auto;}
}
</style>

  "meaning": "Money is the most brutally honest mirror you'll ever stand in front of. 🪞💯\n\nHowever it's behaving, scarce, chaotic, feast-then-famine 🍽️, gone the second it arrives, it's not a verdict on your worth. It's a reflection of a pattern running underneath, usually one you learned so young you forgot it was even there. 👶\n\nHere's the relief 😮‍💨, you can't fix a reflection by yelling at the mirror. 📣🚫 Change what's being reflected, the old belief, the inherited fear, the tired story, and the image rearranges itself without you touching the glass. ✨",

var TABS = [
  ["pull", "I",   "Pull Your Card"],
  ["card", "II",  "Your Card"],
  ["more", "\u2726", "Embody Wealth"]
];

var state = { tab:"pull", three:[], picked:null };

function el(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined && txt !== null) n.textContent = txt;
  return n;
}
function paras(cls, text){
  var box = el("div", cls);
  String(text || "").split(/\n\n+/).forEach(function(chunk){
    var t = chunk.trim();
    if (t) box.appendChild(el("p", null, t));
  });
  return box;
}
function cardImg(card){
  var img = document.createElement("img");
  img.src = CARD_IMG_BASE + card.slug + ".png";
  img.alt = card.title;
  return img;
}
function chosen(){ return state.picked === null ? null : DECK[state.picked]; }

/* ---------- rail ---------- */
function buildRail(){
  var nav = document.getElementById("railNav");
  nav.innerHTML = "";
  TABS.forEach(function(t){
    var b = el("button", "tab");
    b.type = "button";
    b.dataset.tab = t[0];
    b.appendChild(el("span", "tab-num", t[1]));
    b.appendChild(el("span", "tab-label", t[2]));
    b.addEventListener("click", function(){
      if (b.classList.contains("locked")) return;
      goTab(t[0]);
    });
    nav.appendChild(b);
  });
  syncRail();
}

function syncRail(){
  document.querySelectorAll(".tab").forEach(function(b){
    var name = b.dataset.tab;
    b.classList.toggle("active", name === state.tab);
    var locked = (name === "card") && state.picked === null;
    b.classList.toggle("locked", locked);
    b.setAttribute("aria-disabled", locked ? "true" : "false");
  });
  renderRailCard();
}

function renderRailCard(){
  var host = document.getElementById("railCards");
  host.innerHTML = "";
  var card = chosen();
  if (!card) return;

  var wrap = el("div", "rail-cards");
  wrap.appendChild(el("div", "rail-cards-label", "Your card"));
  var box = el("div", "rail-card");
  var frame = el("div", "rail-card-img");
  frame.appendChild(cardImg(card));
  box.appendChild(frame);
  box.appendChild(el("div", "rail-card-name", card.title));
  wrap.appendChild(box);

  var again = el("button", "btn tiny rail-restart", "Pull Again");
  again.type = "button";
  again.addEventListener("click", resetAll);
  wrap.appendChild(again);

  host.appendChild(wrap);
}

function goTab(name){
  state.tab = name;
  document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
  var view = document.getElementById("view-" + name);
  if (view) view.classList.add("active");
  if (name === "pull") renderPull();
  if (name === "card") renderCard();
  if (name === "more") renderMore();
  syncRail();
  window.scrollTo({ top:0, behavior:"smooth" });
}

function resetAll(){
  state.three = [];
  state.picked = null;
  goTab("pull");
}

/* ---------- I. pull ---------- */
function drawThree(){
  var pool = DECK.map(function(_, i){ return i; });
  var out = [];
  for (var k = 0; k < 3; k++){
    out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return out;
}

function renderPull(){
  var host = document.getElementById("view-pull");
  host.innerHTML = "";
  state.three = drawThree();
  state.picked = null;

  host.appendChild(el("div", "eyebrow", "The Wealthy Woman Oracle"));
  var h = el("h1", "display");
  h.appendChild(document.createTextNode("Pick the one "));
  h.appendChild(el("em", null, "your hand goes to"));
  h.appendChild(document.createTextNode("."));
  host.appendChild(h);
  host.appendChild(el("p", "lede", "Take one breath. Hold whatever you've actually been chewing on, the money question, the pricing thing, the decision you keep circling. Then pick without thinking about it."));

  var grid = el("div", "pick");
  state.three.forEach(function(idx, n){
    var b = el("button", "pick-card");
    b.type = "button";
    b.setAttribute("aria-label", "Card " + (n + 1));
    var img = document.createElement("img");
    img.src = CARD_BACK;
    img.alt = "";
    b.appendChild(img);
    b.addEventListener("click", function(){
      if (state.picked !== null) return;
      state.picked = idx;
      b.classList.add("chosen");
      grid.querySelectorAll(".pick-card:not(.chosen)").forEach(function(c){ c.classList.add("faded"); });
      setTimeout(function(){ goTab("card"); }, 950);
    });
    grid.appendChild(b);
  });
  host.appendChild(grid);
  host.appendChild(el("p", "pick-note", "Three cards, drawn fresh from a deck of thirty-one."));
}

/* ---------- II. your card ---------- */
function renderCard(){
  var host = document.getElementById("view-card");
  host.innerHTML = "";
  var card = chosen();
  if (!card) return;

  host.appendChild(el("div", "eyebrow", "Your Card"));
  var hero = el("div", "card-hero");
  hero.appendChild(cardImg(card));
  host.appendChild(hero);
  host.appendChild(el("h1", "card-title", card.title));
  host.appendChild(el("p", "card-tagline", card.desc));

  var short = el("div", "panel in-short");
  short.appendChild(el("div", "panel-label", "In Short"));
  short.appendChild(paras("body-text", card.summary));
  host.appendChild(short);

  var mean = el("div", "panel");
  mean.appendChild(el("div", "panel-label", "The Meaning"));
  mean.appendChild(paras("body-text", card.meaning));
  host.appendChild(mean);

  var why = el("div", "panel");
  why.appendChild(el("div", "panel-label", "Why You Pulled This"));
  why.appendChild(paras("body-text", card.why));
  host.appendChild(why);

  var prac = el("div", "panel practice");
  prac.appendChild(el("div", "panel-label", "The Practice"));
  prac.appendChild(el("h4", "practice-title", card.practiceTitle));
  prac.appendChild(paras("body-text", card.practiceText));
  host.appendChild(prac);

  if (card.tapping) host.appendChild(tappingPanel(card));

  var acts = el("div", "actions");
  var again = el("button", "btn primary", "Pull Another Card");
  again.type = "button";
  again.addEventListener("click", resetAll);
  acts.appendChild(again);

  var more = el("button", "btn", "Get The Full Deck");
  more.type = "button";
  more.addEventListener("click", function(){ goTab("more"); });
  acts.appendChild(more);
  host.appendChild(acts);
}

function tappingPanel(card){
  var t = card.tapping;
  var p = el("div", "panel tapping");
  p.appendChild(el("div", "panel-label", "Tap It Out"));
  p.appendChild(el("p", "tap-intro", "This card sits on an old money belief, so tapping shifts it faster than thinking about it will. If you've never done EFT, you tap lightly with two fingers on each point while you say the line out loud. That's the whole technique. Run through it twice."));

  var setup = el("div", "tap-setup");
  setup.appendChild(el("div", "tap-setup-label", "Setup \u00B7 tap the side of your hand, say it three times"));
  setup.appendChild(el("div", "tap-setup-text", t.setup));
  p.appendChild(setup);

  var ul = el("ul", "tap-points");
  t.points.forEach(function(row){
    var li = document.createElement("li");
    li.appendChild(el("span", "tap-pt", row[0]));
    li.appendChild(el("span", "tap-say", row[1]));
    ul.appendChild(li);
  });
  p.appendChild(ul);

  p.appendChild(el("p", "tap-close", "Take a breath at the end. Notice what shifted, even a little. Then go and do the practice above, because tapping opens the door and the doing walks you through it."));
  return p;
}

/* ---------- III. embody wealth ---------- */

  host.appendChild(el("div", "eyebrow", "Embody Wealth"));
  var h = el("h1", "display");
  h.appendChild(document.createTextNode("This is one card from "));
  h.appendChild(el("em", null, "a much bigger room"));
  h.appendChild(document.createTextNode("."));
  host.appendChild(h);
  host.appendChild(el("p", "lede", "Embody Wealth is my community for multi-passionate women who left corporate to build something of their own and are done with the scattered offers and the inconsistent months."));
  host.appendChild(el("hr", "rule"));

  var promo = el("div", "promo");
  promo.appendChild(el("div", "panel-label", "\u2726 What's Inside \u2726"));
  var pt = el("h3", "promo-title");
  pt.appendChild(document.createTextNode("The frequency work "));
  pt.appendChild(el("em", null, "and"));
  pt.appendChild(document.createTextNode(" the business tools."));
  promo.appendChild(pt);
  promo.appendChild(el("p", null, "Most spaces give you one or the other. You either get the mindset work with no idea how to sell anything, or the strategy with none of the inner work that makes you able to charge for it. This is both."));
  var ul = el("ul", "use-list");
  [
    "The full 31-card deck with the three-card Path Forward spread, what's blocking you, what's calling you and your next aligned move, read as one message",
    "Group hypnosis, cacao ceremonies and a monthly theme to work through together",
    "The Business Gems Toolbox, interactive tools you can rebrand and use in your own community or sell as a micro offer",
    "Real strategy on your niche, your messaging and building offers people actually buy",
    "Human Design so you stop running your business against your own wiring"
  ].forEach(function(t){ ul.appendChild(el("li", null, t)); });
  promo.appendChild(ul);

  var a = document.createElement("a");
  a.className = "join-btn";
  a.href = COMMUNITY_URL;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = "Come Join Us";
  promo.appendChild(a);
  host.appendChild(promo);

  var deck = el("div", "panel");
  deck.appendChild(el("div", "panel-label", "The Full Deck"));
  var db = el("div", "body-text");
  db.appendChild(el("p", null, "The version you just used shows you three cards. Inside the community you get all thirty-one laid out, plus the three-card spread that reads your block, your call and your next move as one message rather than three separate answers."));
  db.appendChild(el("p", null, "Premium members also get the raw file, so you can rebrand the whole thing and put it in your own community, sell it as a micro offer, or drop it into a course."));
  deck.appendChild(db);

  var d = document.createElement("a");
  d.className = "join-btn";
  d.style.background = "var(--grad-btn)";
  d.style.color = "#fff";
  d.href = FULL_DECK_URL;
  d.target = "_blank";
  d.rel = "noopener";
  d.textContent = "Open The Full Deck";
  deck.appendChild(d);
  host.appendChild(deck);

  host.appendChild(el("p", "sign-off", "I believe in you. To living our dreams. \u2014 Aurailia \u2726"));
}

/* ---------- boot ---------- */
buildRail();
goTab("pull");
</script>
